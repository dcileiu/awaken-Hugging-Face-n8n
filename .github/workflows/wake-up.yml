name: Wake up Hugging Face Space

on:
  schedule:
    - cron: '0 0 * * *'  # UTC 时间每天 00:00，可根据你本地时间调整
  workflow_dispatch:   # 可手动触发

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Hugging Face Space
        run: |
          echo "=== Start waking up Hugging Face Space ==="
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://itianci-n8n.hf.space)
          if [ "$STATUS" -eq 200 ]; then
            echo "✅ Space is awake! HTTP status code: $STATUS"
          else
            echo "⚠️ Failed to wake up Space. HTTP status code: $STATUS"
          fi
          echo "=== Finished ==="
