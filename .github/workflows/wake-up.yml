name: Wake up Hugging Face Spaces

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Spaces
        run: |
          echo "=== Wake up Space 1 ==="
          curl -s -o /dev/null -w "Space1 HTTP status: %{http_code}\n" https://itianci-n8n.hf.space

          echo "=== Wake up Space 2 ==="
          curl -s -o /dev/null -w "Space2 HTTP status: %{http_code}\n" https://a123123sd-n8n.hf.space

          echo "=== Done ==="
